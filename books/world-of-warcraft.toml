# The World of Warcraft book's classes and subclasses. Only the rules are
# here: import the book itself to use them.
#
# Its classes are the 2024 classes they are made from (the Shaman is the
# Barbarian, the Warrior the Fighter, …), so first come dnt's built-in
# rules for those classes, copied for each WoW class (the same rules,
# naming it). Then the rules for the book's own features.

# ======== The 2024 classes' rules, for the WoW classes ========

# ---- Death Knight (the Paladin) ----

[[feature]]
id = "classFeature:Ability Score Improvement|*|*|*"
class = "Death Knight|WoW"
[[feature.choice]]
pick = "ability_increase"
feats = ["G"]

[[feature]]
id = "classFeature:Epic Boon|*|*|*"
class = "Death Knight|WoW"
[[feature.choice]]
pick = "feat"
feats = ["EB", "G"]

[[feature]]
id = "classFeature:Expertise|*|*|*"
class = "Death Knight|WoW"
[[feature.choice]]
pick = "expertise"
count = "2"

[[feature]]
id = "classFeature:Weapon Mastery|Paladin|XPHB|1"
class = "Death Knight|WoW"
[[feature.choice]]
pick = "weapon_mastery"
count = "2"

[[feature]]
id = "classFeature:Lay on Hands|Paladin|XPHB|1"
class = "Death Knight|WoW"
[[feature.resource]]
key = "lay_on_hands"
name = "Lay on Hands pool"
max = "5 * level('Death Knight')"
recharge = "long_rest"

[[feature]]
id = "classFeature:Channel Divinity|Paladin|XPHB|3"
class = "Death Knight|WoW"
name = "Channel Divinity (Paladin)"
[[feature.resource]]
key = "channel_divinity_paladin"
name = "Channel Divinity"
max = "class.death_knight.channel_divinity"
recharge = "long_rest"
short_rest_regain = "1"

[[feature]]
id = "classFeature:Aura of Protection|Paladin|XPHB|6"
class = "Death Knight|WoW"
[[feature.effect]]
target = "save.str"
add = "max(1, mod.cha)"
[[feature.effect]]
target = "save.dex"
add = "max(1, mod.cha)"
[[feature.effect]]
target = "save.con"
add = "max(1, mod.cha)"
[[feature.effect]]
target = "save.int"
add = "max(1, mod.cha)"
[[feature.effect]]
target = "save.wis"
add = "max(1, mod.cha)"
[[feature.effect]]
target = "save.cha"
add = "max(1, mod.cha)"

[[feature]]
id = "classFeature:Radiant Strikes|Paladin|XPHB|11"
class = "Death Knight|WoW"
[[feature.effect]]
target = "rider.radiant_strikes"
set = "1d8"
origin = "Radiant Strikes: radiant, on every melee weapon or Unarmed Strike hit"

