# ======== The book's own features ========

# ---- Barbarian ----

# Primal Knowledge Totem: once per Long Rest (or a Rage spent).
[[feature]]
id = "classFeature:Totems|Barbarian|XPHB|3|WoW"
[[feature.resource]]
key = "primal_knowledge_totem"
name = "Primal Knowledge Totem"
max = "1"
recharge = "long_rest"

# The three Raging Elements options: Rage Damage dice of each.
[[feature]]
id = "subclassFeature:Raging Elements|Barbarian|XPHB|Elements|WoW|3|WoW"
[[feature.action]]
name = "Icefury"
when = "toggle('raging')"
attack = "mod.con + prof + d20.bonus"
damage = "dice(class.barbarian.rage_damage, 8)"
damage_type = "cold"
note = "a Bonus Action; 30 ft; the target's next Fire damage is 1d10 more"
[[feature.action]]
name = "Lava Burst"
when = "toggle('raging')"
save = "dex"
dc = "8 + mod.con + prof"
damage = "dice(class.barbarian.rage_damage, 4)"
damage_type = "fire"
note = "a Bonus Action; 30 ft; half on a save; on a fail its next Lightning damage is 1d8 more"
[[feature.action]]
name = "Lightning Bolt"
when = "toggle('raging')"
save = "dex"
dc = "8 + mod.con + prof"
damage = "dice(class.barbarian.rage_damage, 6)"
damage_type = "lightning"
note = "a Bonus Action; 30 ft; half on a save; on a fail its next Cold damage is 1d6 more"

# Resistance to cold, fire and lightning while raging.
[[feature]]
id = "subclassFeature:Primordial Bond|Barbarian|XPHB|Elements|WoW|10|WoW"
[[feature.defense]]
resist = ["cold", "fire", "lightning"]
when = "toggle('raging')"

# Strike: 1d4 more on a weapon or Unarmed Strike hit while raging.
[[feature]]
id = "subclassFeature:Spiritual Protectors|Barbarian|XPHB|Spiritual Guardian|WoW|3|WoW"
[[feature.effect]]
target = "rider.spiritual_protectors"
set = "1d4"
when = "toggle('raging')"
origin = "Spiritual Protectors (Strike): cold, fire or lightning, on a weapon or Unarmed Strike hit while raging"

